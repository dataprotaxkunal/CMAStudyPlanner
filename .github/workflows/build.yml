name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle Wrapper
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build APK
      run: |
        gradle assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m" 2>&1 | tee build.log || true
        echo "=== ERRORS ==="
        grep "^e:" build.log || echo "No Kotlin errors"
        echo "=== END ==="
        if grep -q "BUILD SUCCESSFUL" build.log; then
          echo "BUILD PASSED"
        else
          tail -30 build.log
          exit 1
        fi

    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-log
        path: build.log

    - uses: actions/upload-artifact@v4
      if: success()
      with:
        name: CMAStudyPlanner-APK
        path: app/build/outputs/apk/debug/app-debug.apk
