name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup signing key
      run: |
        echo "" | base64 -d > app/debug.keystore
        cat > app/signing.gradle << 'SIGN'
        android.signingConfigs {
            debug {
                storeFile file("debug.keystore")
                storePassword "studyplanner123"
                keyAlias "debugkey"
                keyPassword "studyplanner123"
            }
        }
        android.buildTypes.debug.signingConfig = android.signingConfigs.debug
        SIGN
        echo 'apply from: "signing.gradle"' >> app/build.gradle.kts

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'
    - name: Build
      run: gradle assembleDebug
    - uses: actions/upload-artifact@v4
      if: success()
      with:
        name: CMAStudyPlanner-APK
        path: app/build/outputs/apk/debug/app-debug.apk
