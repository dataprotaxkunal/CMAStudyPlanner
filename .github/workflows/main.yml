name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix compile errors
      run: |
        cd app/src/main/java/com/cma/studyplanner
        sed -i '/googlefonts/d' ui/theme/Theme.kt
        find . -name "*.kt" -exec sed -i '/@file:OptIn/d' {} \;
        find . -name "*.kt" -exec sed -i '/^@OptIn(Experimental/d' {} \;
        for f in ui/screens/ScheduleScreen.kt ui/screens/RevisionScreen.kt ui/screens/FocusScreen.kt ui/screens/CalendarScreen.kt ui/screens/SettingsScreen.kt ui/screens/DashboardScreen.kt ui/screens/OnboardingScreen.kt ui/components/Components.kt; do
          sed -i '1s/^/@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)\n/' "$f"
        done
        sed -i '1s/^/@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class, androidx.compose.foundation.layout.ExperimentalLayoutApi::class)\n/' ui/screens/SubjectsScreen.kt
        sed -i '1s/^/@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class, androidx.compose.foundation.ExperimentalFoundationApi::class)\n/' MainActivity.kt
        find . -name "*.kt" -exec sed -i 's/progress = { 1f },/progress = 1f,/g' {} \;
        find . -name "*.kt" -exec sed -i 's/progress = { progress },/progress = progress,/g' {} \;
        find . -name "*.kt" -exec sed -i 's/progress = { doneCh.toFloat() \/ totalCh },/progress = doneCh.toFloat() \/ totalCh,/g' {} \;
        find . -name "*.kt" -exec sed -i 's/mutableIntStateOf/mutableStateOf/g' {} \;

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Debug APK
      run: |
        gradle assembleDebug 2>&1 | tee build_output.txt || true
        echo ""
        echo "========== KOTLIN ERRORS =========="
        grep "^e:" build_output.txt || echo "No errors"
        echo "========== END =========="
        if grep -q "BUILD SUCCESSFUL" build_output.txt; then echo "BUILD PASSED"; else exit 1; fi

    - name: Upload error log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-errors
        path: build_output.txt

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: CMAStudyPlanner-APK
        path: app/build/outputs/apk/debug/app-debug.apk
