# Add editing state
if 'editScheduleId' not in s:
    s = s.replace(
        'var showAddDialog by remember { mutableStateOf(false) }',
        'var showAddDialog by remember { mutableStateOf(false) }\n    var editScheduleId by remember { mutableStateOf<String?>(null) }'
    )

# Add onEdit callback to ScheduleItem
if 'onEdit' not in s:
    s = s.replace(
        'onDelete = { vm.deleteSchedule(sch.id) }\n                    )\n                    Spacer',
        'onDelete = { vm.deleteSchedule(sch.id) },\n                        onEdit = {\n                            editScheduleId = sch.id\n                            showAddDialog = true\n                        }\n                    )\n                    Spacer'
    )

with open('ui/screens/ScheduleScreen.kt', 'w') as f:
    f.write(s)
print('ScheduleScreen fixed')
"

