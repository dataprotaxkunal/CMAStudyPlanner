name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Apply all fixes
      run: |
        cd app/src/main/java/com/cma/studyplanner
        
        # Standard compile fixes
        sed -i '/googlefonts/d' ui/theme/Theme.kt
        find . -name "*.kt" -exec sed -i '/@file:OptIn/d' {} \;
        find . -name "*.kt" -exec sed -i '/^@OptIn(Experimental/d' {} \;
        for f in ui/screens/ScheduleScreen.kt ui/screens/RevisionScreen.kt ui/screens/FocusScreen.kt ui/screens/CalendarScreen.kt ui/screens/SettingsScreen.kt ui/screens/DashboardScreen.kt ui/screens/OnboardingScreen.kt ui/components/Components.kt; do
          [ -f "$f" ] && sed -i '1s/^/@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)\n/' "$f"
        done
        [ -f "ui/screens/SubjectsScreen.kt" ] && sed -i '1s/^/@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class, androidx.compose.foundation.layout.ExperimentalLayoutApi::class)\n/' ui/screens/SubjectsScreen.kt
        sed -i '1s/^/@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class, androidx.compose.foundation.ExperimentalFoundationApi::class)\n/' MainActivity.kt
        find . -name "*.kt" -exec sed -i 's/progress = { 1f },/progress = 1f,/g' {} \;
        find . -name "*.kt" -exec sed -i 's/progress = { progress },/progress = progress,/g' {} \;
        find . -name "*.kt" -exec sed -i 's/progress = { doneCh.toFloat() \/ totalCh },/progress = doneCh.toFloat() \/ totalCh,/g' {} \;
        find . -name "*.kt" -exec sed -i 's/mutableIntStateOf/mutableStateOf/g' {} \;

        # === REWRITE BROKEN FILES COMPLETELY ===
        
        # 1. Fix DashboardScreen - proper Overview/Progress split + revision hours
        python3 -c "
import re
with open('ui/screens/DashboardScreen.kt') as f:
    d = f.read()

# Add clickable import
if 'import androidx.compose.foundation.clickable' not in d:
    d = d.replace('import androidx.compose.foundation.background', 'import androidx.compose.foundation.background\nimport androidx.compose.foundation.clickable')

# Add revisions collection
if 'val revisions by vm.revisions' not in d:
    d = d.replace('val schedules by vm.schedules.collectAsState()', 'val schedules by vm.schedules.collectAsState()\n    val revisions by vm.revisions.collectAsState()')

# Fix study hours to include revision hours
if 'revisionHours' not in d:
    d = d.replace(
        'val studyHours = schedules.filter { it.completed }\n            .sumOf { vm.timeDiffMinutes(it.startTime, it.endTime).coerceAtLeast(0) } / 60.0',
        'val scheduleHrs = schedules.filter { it.completed }\n            .sumOf { vm.timeDiffMinutes(it.startTime, it.endTime).coerceAtLeast(0) } / 60.0\n        val revisionHrs = revisions.filter { it.completed }\n            .sumOf { vm.timeDiffMinutes(it.startTime, it.endTime).coerceAtLeast(0) } / 60.0\n        val studyHours = scheduleHrs + revisionHrs'
    )

# Add dashSection state
if 'dashSection' not in d:
    d = d.replace(
        'val todaySchedules = vm.getTodaySchedules()',
        'val todaySchedules = vm.getTodaySchedules()\n    var dashSection by remember { mutableStateOf(\"overview\") }'
    )

# Add Overview/Progress toggle after greeting banner
if 'dashSection ==' not in d:
    # Find the spot after greeting banner closing and before exam countdown
    d = d.replace(
        '        Spacer(modifier = Modifier.height(12.dp))\n\n        // Exam countdown',
        '''        Spacer(modifier = Modifier.height(10.dp))

        // Section Toggle
        Row(
            modifier = Modifier.fillMaxWidth()
                .clip(RoundedCornerShape(10.dp))
                .background(MaterialTheme.colorScheme.surface)
                .padding(3.dp)
        ) {
            listOf(\"overview\" to \"Overview\", \"progress\" to \"Progress\").forEach { (key, label) ->
                Box(
                    modifier = Modifier.weight(1f)
                        .clip(RoundedCornerShape(8.dp))
                        .background(if (dashSection == key) Indigo else Color.Transparent)
                        .clickable { dashSection = key }
                        .padding(vertical = 8.dp),
                    contentAlignment = Alignment.Center
                ) {
                    Text(label, fontSize = 12.sp, fontWeight = FontWeight.Bold,
                        color = if (dashSection == key) Color.White else Muted)
                }
            }
        }

        Spacer(modifier = Modifier.height(12.dp))

      if (dashSection == \"overview\") {
        // Exam countdown'''
    )
    
    # Close overview section before weekly tracking
    d = d.replace(
        '        Spacer(modifier = Modifier.height(14.dp))\n\n        // Weekly Study Tracking',
        '      } // end overview\n\n      if (dashSection == \"progress\") {\n        // Weekly Study Tracking'
    )
    
    # Close progress section before final spacer
    d = d.replace(
        '        Spacer(modifier = Modifier.height(80.dp))\n    }',
        '      } // end progress\n\n        Spacer(modifier = Modifier.height(80.dp))\n    }'
    )

# Add onEdit to ScheduleItem calls
if 'onEdit' not in d:
    d = d.replace(
        'onDelete = { vm.deleteSchedule(sch.id) }\n                )',
        'onDelete = { vm.deleteSchedule(sch.id) },\n                    onEdit = { }\n                )'
    )

with open('ui/screens/DashboardScreen.kt', 'w') as f:
    f.write(d)
print('DashboardScreen fixed')
"
        
        # 2. Fix ScheduleScreen - working edit dialog
        python3 -c "
