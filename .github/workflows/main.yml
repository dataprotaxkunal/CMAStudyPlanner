name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix all compile errors
      run: |
        cd app/src/main/java/com/cma/studyplanner

        # Fix: Remove googlefonts imports
        sed -i '/googlefonts/d' ui/theme/Theme.kt

        # Fix: Add file-level OptIn to ALL files
        for f in ui/screens/ScheduleScreen.kt ui/screens/RevisionScreen.kt ui/screens/FocusScreen.kt ui/screens/CalendarScreen.kt ui/screens/SettingsScreen.kt ui/screens/DashboardScreen.kt ui/screens/SubjectsScreen.kt ui/components/Components.kt MainActivity.kt; do
          if ! grep -q "@file:OptIn" "$f" 2>/dev/null; then
            sed -i '1s/^/@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)\n/' "$f"
          fi
        done

        # Fix: SubjectsScreen needs ExperimentalLayoutApi too
        sed -i 's/@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)/@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class, androidx.compose.foundation.layout.ExperimentalLayoutApi::class)/' ui/screens/SubjectsScreen.kt

        # Fix: MainActivity needs ExperimentalFoundationApi for HorizontalPager
        sed -i 's/@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)/@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class, androidx.compose.foundation.ExperimentalFoundationApi::class)/' MainActivity.kt

        # Fix: Lambda progress to direct Float
        find . -name "*.kt" -exec sed -i 's/progress = { 1f },/progress = 1f,/g' {} \;
        find . -name "*.kt" -exec sed -i 's/progress = { progress },/progress = progress,/g' {} \;
        find . -name "*.kt" -exec sed -i 's/progress = { doneCh.toFloat() \/ totalCh },/progress = doneCh.toFloat() \/ totalCh,/g' {} \;

        # Fix: Remove duplicate function-level @OptIn
        find . -name "*.kt" -exec sed -i '/^@OptIn(ExperimentalMaterial3Api/d' {} \;
        find . -name "*.kt" -exec sed -i '/^@OptIn(ExperimentalLayoutApi/d' {} \;

        # Fix: mutableIntStateOf -> mutableStateOf (compatibility)
        find . -name "*.kt" -exec sed -i 's/mutableIntStateOf/mutableStateOf/g' {} \;

        # Fix: Remove any duplicate @file:OptIn lines
        find . -name "*.kt" -exec sh -c 'awk "!seen[\$0]++" "$1" > "$1.tmp" && mv "$1.tmp" "$1"' _ {} \;

        echo "All fixes applied"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Debug APK
      run: gradle assembleDebug --info 2>&1 | tail -100

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CMAStudyPlanner-APK
        path: app/build/outputs/apk/debug/app-debug.apk
