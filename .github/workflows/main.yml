name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix compile errors
      run: |
        cd app/src/main/java/com/cma/studyplanner

        # Fix 1: Remove googlefonts imports
        sed -i '/googlefonts/d' ui/theme/Theme.kt

        # Fix 2: Add file-level OptIn to all screen files
        for f in ui/screens/ScheduleScreen.kt ui/screens/RevisionScreen.kt ui/screens/FocusScreen.kt ui/screens/CalendarScreen.kt ui/screens/SettingsScreen.kt ui/screens/DashboardScreen.kt ui/components/Components.kt MainActivity.kt; do
          sed -i '1s/^/@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)\n/' "$f"
        done
        sed -i '1s/^/@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class, androidx.compose.foundation.layout.ExperimentalLayoutApi::class)\n/' ui/screens/SubjectsScreen.kt

        # Fix 3: Remove duplicate function-level OptIn
        for f in ui/screens/*.kt ui/components/*.kt MainActivity.kt; do
          sed -i '/^@OptIn(ExperimentalMaterial3Api/d' "$f"
          sed -i '/^@OptIn(ExperimentalLayoutApi/d' "$f"
        done

        # Fix 4: Lambda progress to Float progress
        find . -name "*.kt" -exec sed -i 's/progress = { 1f },/progress = 1f,/g' {} \;
        find . -name "*.kt" -exec sed -i 's/progress = { progress },/progress = progress,/g' {} \;
        find . -name "*.kt" -exec sed -i 's/progress = { doneCh.toFloat() \/ totalCh },/progress = doneCh.toFloat() \/ totalCh,/g' {} \;

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CMAStudyPlanner-APK
        path: app/build/outputs/apk/debug/app-debug.apk
