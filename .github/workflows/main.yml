        # 4. Fix SubjectsScreen - add Table/Card toggle
        python3 -c "
with open('ui/screens/SubjectsScreen.kt') as f:
    s = f.read()

# Add view toggle state and table view
if 'viewMode' not in s:
    s = s.replace(
        'var showAddSubject by remember { mutableStateOf(false) }',
        'var showAddSubject by remember { mutableStateOf(false) }\n    var viewMode by remember { mutableStateOf(\"table\") }'
    )
    
    # Add toggle buttons after the Add button
    s = s.replace(
        '        Spacer(modifier = Modifier.height(20.dp))\n\n        if (subjects.isEmpty())',
        '''        Spacer(modifier = Modifier.height(12.dp))

        // View Toggle
        Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
            listOf(\"table\" to \"Table\", \"cards\" to \"Cards\").forEach { (key, label) ->
                FilterChip(
                    selected = viewMode == key,
                    onClick = { viewMode = key },
                    label = { Text(label, fontSize = 12.sp) },
                    shape = RoundedCornerShape(8.dp)
                )
            }
        }

        Spacer(modifier = Modifier.height(12.dp))

        // Table View
        if (viewMode == \"table\" && subjects.isNotEmpty()) {
            Card(
                shape = RoundedCornerShape(12.dp),
                colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                modifier = Modifier.fillMaxWidth()
            ) {
                Column {
                    // Table Header
                    Row(
                        modifier = Modifier.fillMaxWidth()
                            .background(Color(0xFF1E1E2E))
                            .padding(horizontal = 8.dp, vertical = 10.dp)
                    ) {
                        Text(\"#\", color = Color.White, fontSize = 10.sp, fontWeight = FontWeight.Bold, modifier = Modifier.width(28.dp))
                        Text(\"Subject\", color = Color.White, fontSize = 10.sp, fontWeight = FontWeight.Bold, modifier = Modifier.weight(1f))
                        Text(\"Chapter\", color = Color.White, fontSize = 10.sp, fontWeight = FontWeight.Bold, modifier = Modifier.weight(1.5f))
                        Text(\"Status\", color = Color.White, fontSize = 10.sp, fontWeight = FontWeight.Bold, modifier = Modifier.width(56.dp), textAlign = androidx.compose.ui.text.style.TextAlign.Center)
                    }

                    // Table Rows
                    var serialNo = 0
                    subjects.forEach { swc ->
                        val color = Color(vm.colors[swc.subject.colorIndex % vm.colors.size])
                        swc.chapters.forEach { chapter ->
                            serialNo++
                            val bgColor = if (serialNo % 2 == 0) Color(0xFFFAFBFC) else Color.White
                            Row(
                                modifier = Modifier.fillMaxWidth()
                                    .background(bgColor)
                                    .padding(horizontal = 8.dp, vertical = 6.dp),
                                verticalAlignment = Alignment.CenterVertically
                            ) {
                                Text(\"\$serialNo\", fontSize = 9.sp, color = Muted, fontWeight = FontWeight.SemiBold, modifier = Modifier.width(28.dp))
                                Row(modifier = Modifier.weight(1f), verticalAlignment = Alignment.CenterVertically) {
                                    Box(modifier = Modifier.width(3.dp).height(14.dp).clip(RoundedCornerShape(1.dp)).background(color))
                                    Spacer(modifier = Modifier.width(4.dp))
                                    Text(swc.subject.name, fontSize = 9.sp, fontWeight = FontWeight.SemiBold, maxLines = 1)
                                }
                                Text(chapter.name, fontSize = 9.sp, color = Color(0xFF444444), modifier = Modifier.weight(1.5f), maxLines = 1)
                                Box(
                                    modifier = Modifier.width(56.dp)
                                        .clip(RoundedCornerShape(8.dp))
                                        .background(if (chapter.done) Color(0xFFD1FAE5) else Color(0xFFFEF3C7))
                                        .clickable { vm.toggleChapter(chapter) }
                                        .padding(vertical = 3.dp),
                                    contentAlignment = Alignment.Center
                                ) {
                                    Text(
                                        if (chapter.done) \"Done\" else \"Pending\",
                                        fontSize = 8.sp, fontWeight = FontWeight.Bold,
                                        color = if (chapter.done) Color(0xFF059669) else Color(0xFFD97706)
                                    )
                                }
                            }
                            Divider(color = Color(0xFFF5F5F5), thickness = 0.5.dp)
                        }
                    }
                }
            }
        }

        if (viewMode == \"cards\" && subjects.isEmpty() || viewMode == \"table\" && subjects.isEmpty())'
    )
    
    # Wrap existing card view in viewMode check
    s = s.replace(
        'if (subjects.isEmpty()) {\n            EmptyState',
        'if (subjects.isEmpty()) {\n            EmptyState'
    )
    
    # Add viewMode == cards check around the existing forEach
    old_foreach = '        } else {\n            subjects.forEach { swc ->'
    if old_foreach in s and 'viewMode == \"cards\"' not in s:
        s = s.replace(old_foreach, '        }\n\n        if (viewMode == \"cards\" && subjects.isNotEmpty()) {\n            subjects.forEach { swc ->')

with open('ui/screens/SubjectsScreen.kt', 'w') as f:
    f.write(s)
print('SubjectsScreen table view added')
"

        # 5. Fix weekly tracking to include revision hours
        python3 -c "
with open('viewmodel/MainViewModel.kt') as f:
    v = f.read()
old = 'return schedules.value\n            .filter { it.completed && it.date >= weekStart.toString() && it.date <= weekEnd.toString() }\n            .sumOf { timeDiffMinutes(it.startTime, it.endTime).coerceAtLeast(0) } / 60f'
new = 'val sh = schedules.value\n            .filter { it.completed && it.date >= weekStart.toString() && it.date <= weekEnd.toString() }\n            .sumOf { timeDiffMinutes(it.startTime, it.endTime).coerceAtLeast(0) } / 60f\n        val rh = revisions.value\n            .filter { it.completed && it.date >= weekStart.toString() && it.date <= weekEnd.toString() }\n            .sumOf { timeDiffMinutes(it.startTime, it.endTime).coerceAtLeast(0) } / 60f\n        return sh + rh'
if 'val sh = schedules' not in v:
    v = v.replace(old, new)
with open('viewmodel/MainViewModel.kt', 'w') as f:
    f.write(v)
print('ViewModel weekly tracking fixed')
"

        # 6. Battery optimization in Settings
        python3 -c "
