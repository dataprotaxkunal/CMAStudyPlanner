        echo "ALL FIXES DONE"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Debug APK
      run: |
        gradle assembleDebug 2>&1 | tee build_output.txt || true
        echo ""
        echo "========== KOTLIN ERRORS =========="
        grep "^e:" build_output.txt || echo "No errors"
        echo "========== END =========="
        if grep -q "BUILD SUCCESSFUL" build_output.txt; then echo "BUILD PASSED"; else exit 1; fi

    - name: Upload error log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-errors
        path: build_output.txt

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: CMAStudyPlanner-APK
        path: app/build/outputs/apk/debug/app-debug.apk
