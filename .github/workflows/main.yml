                Text(\"Disable Battery Optimization\", fontWeight = FontWeight.SemiBold, fontSize = 14.sp)
                Text(\"Required for alarms on Samsung, Xiaomi, Oppo, Vivo\", fontSize = 11.sp, color = Muted)
                Spacer(modifier = Modifier.height(8.dp))
                Button(onClick = { try { context.startActivity(android.content.Intent(android.provider.Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS)) } catch (e: Exception) {} }, shape = RoundedCornerShape(8.dp), modifier = Modifier.fillMaxWidth()) { Text(\"Open Battery Settings\", fontSize = 12.sp) }
            }
        }
        Spacer(modifier = Modifier.height(24.dp))
